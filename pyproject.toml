[project]
name = "arena-core"
version = "0.1.0"
description = "Unified factor data ingestion and DolphinDB-native factor DSL"
readme = "README.md"
requires-python = ">=3.12,<3.13"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
dependencies = [
    "dolphindb>=3.0.4.2",
    "loguru>=0.7.3",
    "numpy>=2.0",
    "pandas>=2.2",
    "pydantic>=2.11",
    "python-dotenv>=1.1",
    "tushare>=1.4.29",
]

[project.scripts]
core-manage = "core.manage:main"

[build-system]
requires = ["uv_build>=0.9.26,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "core"
source-include = ["examples/**"]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "notebook>=7.6.1",
]
