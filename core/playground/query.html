<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Core Query Console</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.468.0/dist/umd/lucide.min.js"></script>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0d0f10;
      --panel: #111416;
      --panel-2: #161a1d;
      --panel-3: #1b2024;
      --line: #2a3035;
      --line-strong: #3b444b;
      --text: #e8ecef;
      --muted: #89939b;
      --faint: #606a72;
      --accent: #73d5b3;
      --accent-strong: #9ce9cf;
      --accent-ink: #08120f;
      --amber: #e6b566;
      --danger: #ef7d72;
      --blue: #7eb7df;
      --shadow: rgba(0, 0, 0, 0.34);
      --header-height: 54px;
      --radius: 6px;
    }

    html[data-theme="light"] {
      color-scheme: light;
      --bg: #eef1f2;
      --panel: #f8fafb;
      --panel-2: #ffffff;
      --panel-3: #e8edef;
      --line: #d1d8dc;
      --line-strong: #aeb9bf;
      --text: #182026;
      --muted: #5d6870;
      --faint: #7b868d;
      --accent: #087f65;
      --accent-strong: #04634f;
      --accent-ink: #ffffff;
      --amber: #966213;
      --danger: #b83c34;
      --blue: #276f9f;
      --shadow: rgba(28, 38, 44, 0.14);
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: "IBM Plex Sans", sans-serif;
      font-size: 14px;
      letter-spacing: 0;
    }

    button, input, textarea, select { font: inherit; }
    button { color: inherit; }

    .app-header {
      height: var(--header-height);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px 0 18px;
      border-bottom: 1px solid var(--line);
      background: var(--panel);
    }

    .brand {
      display: flex;
      align-items: center;
      min-width: 0;
      gap: 12px;
    }

    .brand-mark {
      display: grid;
      place-items: center;
      width: 28px;
      height: 28px;
      border: 1px solid var(--accent);
      color: var(--accent);
      font-family: "IBM Plex Mono", monospace;
      font-weight: 600;
      font-size: 12px;
    }

    .brand-copy { min-width: 0; }

    .brand-title {
      margin: 0;
      font-family: "IBM Plex Mono", monospace;
      font-size: 13px;
      font-weight: 600;
      line-height: 1.1;
      text-transform: uppercase;
    }

    .brand-subtitle {
      margin-top: 3px;
      color: var(--muted);
      font-size: 11px;
      line-height: 1;
    }

    .header-actions, .toolbar, .status-cluster, .pager, .result-meta {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      height: 28px;
      padding: 0 9px;
      border: 1px solid var(--line);
      color: var(--muted);
      background: var(--panel-2);
      border-radius: var(--radius);
      font-family: "IBM Plex Mono", monospace;
      font-size: 11px;
      white-space: nowrap;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--faint);
    }

    .status-pill.ready .status-dot { background: var(--accent); }
    .status-pill.busy .status-dot { background: var(--amber); animation: pulse 1s infinite; }
    .status-pill.error .status-dot { background: var(--danger); }

    @keyframes pulse { 50% { opacity: .38; } }

    .icon-button, .text-button, .primary-button {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel-2);
      cursor: pointer;
      transition: border-color .14s ease, background .14s ease, color .14s ease;
    }

    .icon-button {
      width: 30px;
      height: 30px;
      display: grid;
      place-items: center;
      padding: 0;
    }

    .icon-button svg, .text-button svg, .primary-button svg { width: 15px; height: 15px; }

    .text-button, .primary-button {
      height: 32px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 0 11px;
      font-weight: 500;
    }

    a.text-button { text-decoration: none; }

    .primary-button {
      border-color: var(--accent);
      background: var(--accent);
      color: var(--accent-ink);
      min-width: 112px;
    }

    .icon-button:hover, .text-button:hover { border-color: var(--line-strong); background: var(--panel-3); }
    .primary-button:hover { background: var(--accent-strong); }
    button:disabled { opacity: .45; cursor: not-allowed; }
    button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

    .workspace {
      width: 100%;
      height: calc(100% - var(--header-height));
      display: grid;
      grid-template-columns: minmax(470px, 46%) 1fr;
      overflow: hidden;
    }

    .panel {
      min-width: 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
      background: var(--panel);
    }

    .query-panel { border-right: 1px solid var(--line-strong); position: relative; overflow: hidden; }
    .results-panel { background: var(--panel-2); }

    .section-header {
      min-height: 43px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 0 12px 0 14px;
      border-bottom: 1px solid var(--line);
      background: var(--panel);
    }

    .section-title {
      display: flex;
      align-items: baseline;
      gap: 9px;
      min-width: 0;
    }

    .section-title h2 {
      margin: 0;
      font-family: "IBM Plex Mono", monospace;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
    }

    .section-title span { color: var(--muted); font-size: 11px; white-space: nowrap; }

    .config-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 9px 10px;
      padding: 11px 12px 12px;
      border-bottom: 1px solid var(--line);
      background: var(--panel-2);
    }

    .field { min-width: 0; }
    .field.span-2 { grid-column: span 2; }
    .field.span-4 { grid-column: span 4; }

    .field label {
      display: block;
      margin-bottom: 5px;
      color: var(--muted);
      font-family: "IBM Plex Mono", monospace;
      font-size: 10px;
      font-weight: 500;
      text-transform: uppercase;
    }

    .field input, .field select, .filter-input {
      width: 100%;
      height: 32px;
      padding: 0 9px;
      border: 1px solid var(--line);
      border-radius: 4px;
      background: var(--panel);
      color: var(--text);
      font-family: "IBM Plex Mono", monospace;
      font-size: 11px;
    }

    .codes-control {
      display: grid;
      grid-template-columns: minmax(150px, 0.9fr) minmax(0, 3.1fr);
      gap: 8px;
    }

    .codes-control input[readonly] {
      color: var(--muted);
      cursor: default;
    }

    .editor-shell { flex: 1; min-height: 210px; position: relative; }
    #editor { position: absolute; inset: 0; }

    #editor .monaco-editor .lines-content .core-guide,
    #editor .monaco-editor .lines-content .core-guide-indent {
      transform: translateX(-1px);
    }

    .editor-footer {
      min-height: 35px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 0 12px;
      border-top: 1px solid var(--line);
      background: var(--panel-2);
      color: var(--muted);
      font-family: "IBM Plex Mono", monospace;
      font-size: 10px;
    }

    .ast-path {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .diagnostic-link {
      border: 0;
      padding: 0;
      background: transparent;
      color: var(--muted);
      font-family: inherit;
      font-size: inherit;
      cursor: pointer;
      white-space: nowrap;
    }

    .diagnostic-link.has-error { color: var(--danger); }
    .diagnostic-link.valid { color: var(--accent); }

    .query-actions {
      min-height: 49px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
      border-top: 1px solid var(--line);
      background: var(--panel);
    }

    .query-note {
      color: var(--muted);
      font-size: 11px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .result-toolbar {
      min-height: 48px;
      display: grid;
      grid-template-columns: minmax(160px, 1fr) auto;
      align-items: center;
      gap: 10px;
      padding: 8px 12px;
      border-bottom: 1px solid var(--line);
      background: var(--panel-2);
    }

    .search-wrap { position: relative; min-width: 0; }
    .search-wrap svg { position: absolute; left: 9px; top: 8px; width: 15px; height: 15px; color: var(--muted); }
    .search-wrap .filter-input { padding-left: 31px; }

    .metric {
      min-width: 62px;
      padding-left: 9px;
      border-left: 1px solid var(--line);
    }

    .metric-label { color: var(--muted); font-size: 9px; text-transform: uppercase; }
    .metric-value { margin-top: 2px; font-family: "IBM Plex Mono", monospace; font-size: 11px; }

    .table-shell { flex: 1; min-height: 0; position: relative; overflow: auto; background: var(--panel-2); }

    table {
      width: max-content;
      min-width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      font-family: "IBM Plex Mono", monospace;
      font-size: 11px;
      font-variant-numeric: tabular-nums;
    }

    th, td {
      height: 32px;
      max-width: 320px;
      padding: 0 11px;
      border-right: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      text-align: left;
    }

    th {
      position: sticky;
      z-index: 3;
      top: 0;
      min-width: 116px;
      background: var(--panel-3);
      color: var(--muted);
      font-weight: 500;
      cursor: pointer;
      user-select: none;
    }

    th:first-child, td:first-child { position: sticky; left: 0; z-index: 2; }
    th:first-child { z-index: 4; }
    td:first-child { background: var(--panel-2); }
    tbody tr:hover td { background: color-mix(in srgb, var(--accent) 7%, var(--panel-2)); }
    tbody tr:hover td:first-child { background: color-mix(in srgb, var(--accent) 7%, var(--panel-2)); }
    td.null { color: var(--faint); font-style: italic; }
    td.number { text-align: right; }
    td.boolean { color: var(--amber); }

    .sort-indicator { margin-left: 6px; color: var(--accent); }

    .empty-state {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      pointer-events: none;
    }

    .empty-state-inner { color: var(--muted); text-align: center; }
    .empty-state-inner svg { width: 34px; height: 34px; margin-bottom: 10px; stroke-width: 1.3; }
    .empty-state-title { color: var(--text); font-family: "IBM Plex Mono", monospace; font-size: 12px; }
    .empty-state-subtitle { margin-top: 6px; font-size: 11px; }

    .result-footer {
      min-height: 42px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 6px 12px;
      border-top: 1px solid var(--line);
      background: var(--panel);
      color: var(--muted);
      font-size: 11px;
    }

    .page-size {
      height: 28px;
      border: 1px solid var(--line);
      border-radius: 4px;
      background: var(--panel-2);
      color: var(--text);
      font-family: "IBM Plex Mono", monospace;
      font-size: 10px;
    }

    .toast-stack {
      position: fixed;
      z-index: 100;
      right: 14px;
      bottom: 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: min(390px, calc(100vw - 28px));
      pointer-events: none;
    }

    .toast {
      display: grid;
      grid-template-columns: 18px 1fr;
      gap: 9px;
      padding: 11px 12px;
      border: 1px solid var(--line-strong);
      border-left: 3px solid var(--accent);
      border-radius: var(--radius);
      background: var(--panel-2);
      box-shadow: 0 14px 34px var(--shadow);
      color: var(--text);
      animation: toast-in .18s ease both;
    }

    .toast.error { border-left-color: var(--danger); }
    .toast.warning { border-left-color: var(--amber); }
    .toast svg { width: 16px; height: 16px; margin-top: 1px; }
    .toast-title { font-weight: 600; font-size: 12px; }
    .toast-message { margin-top: 3px; color: var(--muted); font-size: 11px; line-height: 1.45; word-break: break-word; }

    @keyframes toast-in { from { opacity: 0; transform: translateY(8px); } }

    @media (max-width: 980px) {
      html, body { overflow: auto; }
      .workspace { height: auto; min-height: calc(100vh - var(--header-height)); grid-template-columns: 1fr; overflow: visible; }
      .query-panel { height: 760px; border-right: 0; border-bottom: 1px solid var(--line-strong); }
      .results-panel { height: 680px; }
      .config-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .field.span-4 { grid-column: span 2; }
      .field.span-2 { grid-column: span 1; }
    }

    @media (max-width: 620px) {
      .brand-subtitle, #operatorCount, .status-pill span { display: none; }
      .app-header { padding-left: 10px; }
      .config-grid { grid-template-columns: 1fr 1fr; }
      .field.span-2, .field.span-4 { grid-column: span 2; }
      .result-toolbar { grid-template-columns: 1fr; }
      .result-meta { justify-content: space-between; }
    }
  </style>
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <div class="brand-mark">CQ</div>
      <div class="brand-copy">
        <h1 class="brand-title">Core Query Console</h1>
        <div class="brand-subtitle">DolphinDB DSL / DuckDB local result engine</div>
      </div>
    </div>
    <div class="header-actions">
      <a class="text-button" href="/"><i data-lucide="house"></i><span>Home</span></a>
      <a class="text-button" href="/backtest"><i data-lucide="chart-no-axes-combined"></i><span>Backtest</span></a>
      <div id="runtimeStatus" class="status-pill busy">
        <span class="status-dot"></span>
        <span>初始化运行时</span>
      </div>
      <button id="themeButton" class="icon-button" title="切换主题" aria-label="切换主题"><i data-lucide="sun-moon"></i></button>
    </div>
  </header>

  <main class="workspace">
    <section class="panel query-panel">
      <div class="section-header">
        <div class="section-title">
          <h2>Query DSL</h2>
          <span id="operatorCount">加载智能补全</span>
        </div>
      </div>

      <div class="config-grid">
        <div class="field">
          <label for="startDate">start_date</label>
          <input id="startDate" type="date">
        </div>
        <div class="field">
          <label for="endDate">end_date</label>
          <input id="endDate" type="date">
        </div>
        <div class="field span-2">
          <label for="lookback">lookback</label>
          <input id="lookback" type="text" spellcheck="false" placeholder="30D 或 P30D">
        </div>
        <div class="field span-4">
          <label for="codes">codes</label>
          <div class="codes-control">
            <select id="codeSource" aria-label="股票池来源">
              <option value="000300.SH" selected>沪深300 · 000300.SH</option>
              <option value="000016.SH">上证50 · 000016.SH</option>
              <option value="000905.SH">中证500 · 000905.SH</option>
              <option value="000852.SH">中证1000 · 000852.SH</option>
              <option value="manual">手动输入</option>
            </select>
            <input id="codes" type="text" spellcheck="false" placeholder="正在获取最近成分股" readonly>
          </div>
        </div>
      </div>

      <div class="editor-shell"><div id="editor"></div></div>
      <div class="editor-footer">
        <span id="astPath" class="ast-path">AST /</span>
        <button id="diagnosticButton" class="diagnostic-link">等待解析</button>
      </div>
      <div class="query-actions">
        <div id="queryNote" class="query-note">等待 Monaco、算符模型和 DuckDB-Wasm</div>
        <button id="runButton" class="primary-button" disabled><i data-lucide="play"></i><span>执行查询</span></button>
      </div>

    </section>

    <section class="panel results-panel">
      <div class="section-header">
        <div class="section-title">
          <h2>Result Table</h2>
          <span id="resultLabel">尚未查询</span>
        </div>
        <div class="toolbar">
          <button id="downloadParquetButton" class="icon-button" title="下载 Parquet" aria-label="下载 Parquet" disabled><i data-lucide="file-down"></i></button>
          <button id="downloadCsvButton" class="icon-button" title="导出当前结果为 CSV" aria-label="导出 CSV" disabled><i data-lucide="sheet"></i></button>
        </div>
      </div>
      <div class="result-toolbar">
        <div class="search-wrap">
          <i data-lucide="search"></i>
          <input id="tableFilter" class="filter-input" type="search" spellcheck="false" placeholder="在 DuckDB 中筛选当前结果">
        </div>
        <div class="result-meta">
          <div class="metric"><div class="metric-label">Rows</div><div id="rowMetric" class="metric-value">0</div></div>
          <div class="metric"><div class="metric-label">Columns</div><div id="columnMetric" class="metric-value">0</div></div>
          <div class="metric"><div class="metric-label">Elapsed</div><div id="elapsedMetric" class="metric-value">0 ms</div></div>
        </div>
      </div>

      <div class="table-shell">
        <table id="resultTable"><thead></thead><tbody></tbody></table>
        <div id="emptyState" class="empty-state">
          <div class="empty-state-inner">
            <i data-lucide="table-2"></i>
            <div class="empty-state-title">No result loaded</div>
            <div class="empty-state-subtitle">查询返回的 Parquet 将由 DuckDB-Wasm 读取</div>
          </div>
        </div>
      </div>

      <div class="result-footer">
        <div id="duckdbNote">DuckDB-Wasm 未就绪</div>
        <div class="pager">
          <select id="pageSize" class="page-size" title="每页行数" aria-label="每页行数">
            <option value="50">50</option>
            <option value="100" selected>100</option>
            <option value="200">200</option>
          </select>
          <button id="firstPageButton" class="icon-button" title="第一页" aria-label="第一页" disabled><i data-lucide="chevrons-left"></i></button>
          <button id="previousPageButton" class="icon-button" title="上一页" aria-label="上一页" disabled><i data-lucide="chevron-left"></i></button>
          <span id="pageLabel">0 / 0</span>
          <button id="nextPageButton" class="icon-button" title="下一页" aria-label="下一页" disabled><i data-lucide="chevron-right"></i></button>
          <button id="lastPageButton" class="icon-button" title="最后一页" aria-label="最后一页" disabled><i data-lucide="chevrons-right"></i></button>
        </div>
      </div>
    </section>
  </main>

  <div id="toastStack" class="toast-stack"></div>

  <script type="module">
    const CDN = {
      monaco: "https://cdn.jsdelivr.net/npm/monaco-editor@0.52.2/min/vs",
      monacoLoader: "https://cdn.jsdelivr.net/npm/monaco-editor@0.52.2/min/vs/loader.js",
      jsonc: "https://cdn.jsdelivr.net/npm/jsonc-parser@3.3.1/+esm",
      duckdb: "https://cdn.jsdelivr.net/npm/@duckdb/duckdb-wasm@1.32.0/+esm",
    };

    const DEFAULT_ENDPOINT = location.protocol.startsWith("http")
      ? `${location.origin}/query`
      : "http://127.0.0.1:8000/query";

    const state = {
      monaco: null,
      jsonc: null,
      duckdbModule: null,
      db: null,
      connection: null,
      editor: null,
      model: null,
      ast: null,
      parsed: null,
      syntaxMarkers: [],
      localMarkers: [],
      serverMarkers: [],
      operators: [],
      operatorMap: new Map(),
      availableFields: [],
      operatorsLoaded: false,
      fieldsLoaded: false,
      indexCodesCache: new Map(),
      indexRequestSequence: 0,
      manualCodes: "",
      codesReady: false,
      codesLoading: false,
      validationSequence: 0,
      validationTimer: null,
      suggestTimer: null,
      applyingCompletion: false,
      resultBuffer: null,
      resultColumns: [],
      resultTypes: new Map(),
      totalRows: 0,
      filteredRows: 0,
      page: 1,
      pageSize: 100,
      sort: null,
      filter: "",
      lastElapsed: 0,
      resultFile: null,
    };

    const elements = Object.fromEntries([
      "runtimeStatus", "operatorCount", "startDate", "endDate", "lookback", "codeSource", "codes",
      "editor", "astPath", "diagnosticButton", "queryNote", "runButton",
      "themeButton", "resultLabel",
      "downloadParquetButton", "downloadCsvButton", "tableFilter", "rowMetric", "columnMetric", "elapsedMetric", "resultTable",
      "emptyState", "duckdbNote", "pageSize", "firstPageButton", "previousPageButton", "pageLabel", "nextPageButton",
      "lastPageButton", "toastStack",
    ].map((id) => [id, document.getElementById(id)]));

    function refreshIcons() {
      if (window.lucide) window.lucide.createIcons({ attrs: { "stroke-width": 1.8 } });
    }

    function setRuntimeStatus(kind, text) {
      elements.runtimeStatus.className = `status-pill ${kind}`;
      elements.runtimeStatus.querySelector("span:last-child").textContent = text;
    }

    function toast(title, message, kind = "success", timeout = 4200) {
      const node = document.createElement("div");
      node.className = `toast ${kind}`;
      node.innerHTML = `<i data-lucide="${kind === "error" ? "circle-alert" : kind === "warning" ? "triangle-alert" : "circle-check"}"></i><div><div class="toast-title"></div><div class="toast-message"></div></div>`;
      node.querySelector(".toast-title").textContent = title;
      node.querySelector(".toast-message").textContent = message;
      elements.toastStack.appendChild(node);
      refreshIcons();
      setTimeout(() => node.remove(), timeout);
    }

    function loadScript(source) {
      return new Promise((resolve, reject) => {
        const script = document.createElement("script");
        script.src = source;
        script.onload = resolve;
        script.onerror = () => reject(new Error(`无法加载 ${source}`));
        document.head.appendChild(script);
      });
    }

    async function loadMonaco() {
      await loadScript(CDN.monacoLoader);
      const workerBase = CDN.monaco.replace(/vs$/, "");
      const workerSource = `self.MonacoEnvironment={baseUrl:'${workerBase}'};importScripts('${CDN.monaco}/base/worker/workerMain.js');`;
      window.MonacoEnvironment = {
        getWorkerUrl: () => `data:text/javascript;charset=utf-8,${encodeURIComponent(workerSource)}`,
      };
      window.require.config({ paths: { vs: CDN.monaco } });
      await new Promise((resolve) => window.require(["vs/editor/editor.main"], resolve));
      return window.monaco;
    }

    async function loadOperators() {
      const response = await fetch("/operators");
      if (!response.ok) throw new Error(`算符目录请求失败：HTTP ${response.status}`);
      const operators = await response.json();
      operators.sort((left, right) => left.type.localeCompare(right.type) || left.op.localeCompare(right.op));
      state.operators = operators;
      state.operatorMap = new Map(operators.map((operator) => [operator.op, operator]));
      state.operatorsLoaded = true;
      updateCompletionStatus();
    }

    async function loadAvailableFields() {
      const response = await fetch("/factors");
      if (!response.ok) throw new Error(`字段目录请求失败：HTTP ${response.status}`);
      const fields = await response.json();
      state.availableFields = [...new Set(fields.filter((field) => typeof field === "string" && field))].sort();
      state.fieldsLoaded = true;
      updateCompletionStatus();
    }

    async function loadIndexPresets() {
      const selected = elements.codeSource.value;
      const response = await fetch("/indices");
      if (!response.ok) throw new Error(`指数预设请求失败：HTTP ${response.status}`);
      const presets = await response.json();
      const valid = presets.filter((preset) => typeof preset.code === "string" && typeof preset.name === "string");
      if (!valid.length) throw new Error("指数预设为空");
      elements.codeSource.replaceChildren(...valid.map((preset) => {
        const option = document.createElement("option");
        option.value = preset.code;
        option.textContent = `${preset.name} · ${preset.code}`;
        return option;
      }));
      const manual = document.createElement("option");
      manual.value = "manual";
      manual.textContent = "手动输入";
      elements.codeSource.appendChild(manual);
      elements.codeSource.value = [...elements.codeSource.options].some((option) => option.value === selected)
        ? selected
        : valid[0].code;
    }

    function updateCompletionStatus() {
      if (!state.operatorsLoaded || !state.fieldsLoaded) return;
      elements.operatorCount.textContent = `${state.operators.length} 个算符 · ${state.availableFields.length} 个字段`;
    }

    async function initializeDuckDB() {
      elements.duckdbNote.textContent = "正在加载 DuckDB-Wasm";
      const duckdb = await import(CDN.duckdb);
      const bundle = await duckdb.selectBundle(duckdb.getJsDelivrBundles());
      const workerUrl = URL.createObjectURL(new Blob([
        `importScripts("${bundle.mainWorker}");`,
      ], { type: "text/javascript" }));
      const worker = new Worker(workerUrl);
      const logger = new duckdb.ConsoleLogger(duckdb.LogLevel.WARNING);
      const db = new duckdb.AsyncDuckDB(logger, worker);
      await db.instantiate(bundle.mainModule, bundle.pthreadWorker);
      URL.revokeObjectURL(workerUrl);
      state.duckdbModule = duckdb;
      state.db = db;
      state.connection = await db.connect();
      elements.duckdbNote.textContent = "DuckDB-Wasm ready";
    }

      state.editor = state.monaco.editor.create(elements.editor, {

          if (shouldAutoSuggest(context)) {
            state.editor.trigger("typing", "editor.action.triggerSuggest", {});
          }
        }, 60);
      });
      state.editor.onDidChangeCursorPosition(updateAstPath);
      registerCompletionProvider();
      registerEditorActions();
      analyzeDocument();

    async function loadEditorFont() {
      // 等待代码字体可用，避免 Monaco 使用回退字体计算字符网格。
      if (!document.fonts) return;
      await document.fonts.load('400 12px "IBM Plex Mono"');
      await document.fonts.load('500 12px "IBM Plex Mono"');
